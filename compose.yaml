services:
  mssql:
    build:
      context: ./mssql
      dockerfile: Dockerfile
    container_name: mssql
    ports:
      - ${MSSQL_PORT}:1433
    volumes:
      - mssql_data:/var/opt/mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}
      - MSSQL_DBGATE_READER_USERNAME=${MSSQL_DBGATE_READER_USERNAME}
      - MSSQL_DBGATE_READER_PASSWORD=${MSSQL_DBGATE_READER_PASSWORD}
      - MSSQL_PID=Developer
  
  dbgate:
    image: dbgate/dbgate:latest
    container_name: dbgate
    ports:
      - ${DBGATE_PORT}:3000
    volumes:
      - dbgate-data:/root/.dbgate
    environment:
      - CONNECTIONS=con1
      - LABEL_con1=mssql
      - SERVER_con1=mssql
      - USER_con1=${MSSQL_DBGATE_READER_USERNAME}
      - PASSWORD_con1=${MSSQL_DBGATE_READER_PASSWORD}
      - PORT_con1=${MSSQL_PORT}
      - ENGINE_con1=mssql@dbgate-plugin-mssql

  context_retriever:
    build:
      context: ./context-retriever
      dockerfile: Dockerfile
    container_name: context_retriever
    volumes:
      - ./context-retriever:/usr/src/app  


volumes:
  mssql_data:
  dbgate-data:
